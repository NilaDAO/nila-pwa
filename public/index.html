<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- iOS PWA status bar style -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Nila farmland app" />
    <meta property="og:title" content="Nila farm finance app" />
    <meta property="og:description" content="Join your local union to access loans and grants." />
    <meta property="og:image" content="https://nila.land/banner.png" />
    <meta property="og:url" content="https://nila.land" />
    <meta property="og:type" content="app" />
    <meta property="og:locale" content="en_US" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Nila Farm Finance App</title>
    <script>
    (function () {
      const stored = localStorage.getItem('theme'); // 'light' | 'dark' | null (system)
      const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = stored ? stored === 'dark' : systemDark;
      if (isDark) document.documentElement.classList.add('dark');
        // keep in sync with system when user hasn't chosen a manual theme
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        mq.addEventListener('change', (e) => {
          if (!localStorage.getItem('theme')) {
            document.documentElement.classList.toggle('dark', e.matches);
          }
      });
    })();
    </script>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
